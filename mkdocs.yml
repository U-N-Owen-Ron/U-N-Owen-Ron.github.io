site_name: w.paper的小站
site_description: w.paper 的个人小站

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - toc.integrate
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: 切换到暗色模式
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: 切换到亮色模式

extra_css:
  - assets/css/morandi.css

extra_javascript:
  - assets/js/zju.js

nav:
  - 主页: index.md
  - 课程: course/index.md
  - 运动: sports/index.md
  - 娱乐: fun/index.md
  - 音乐: music/index.md
  - 阅读: reading/index.md
  - 友链: friends/index.md
  - 关于: about/index.md
